[project]
name = "asp"
version = "0.1.0"
description = "Adaptive Supervised PatchNCE (ASP) for H&E-to-IHC stain translation"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "numpy>=2",
    "pillow",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "opencv-python",
    "pytorch-fid",
    "matplotlib",
    "dominate",
    "visdom",
    "packaging",
    "tqdm",
    "gputil",
]

[tool.uv]
package = false

# RTX 50xx (sm_120) needs CUDA 12.8 wheels
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
